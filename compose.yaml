name: relay

services:
  relay:
    image: relay:1.0.0
    build: .
    init: true
    restart: unless-stopped
    environment:
      # Optional. Unset, Relay answers at whatever address it is opened at; see .env.example.
      RELAY_ORIGIN: ${RELAY_ORIGIN:-}
      # Optional. Derives link and request tokens; unset, Relay keeps a generated key in the volume.
      RELAY_SECRET: ${RELAY_SECRET:-}
      # Proxies allowed to report the client address. Covers a proxy on the host or on a Docker network.
      RELAY_TRUST_PROXY: ${RELAY_TRUST_PROXY:-127.0.0.1,::1,172.16.0.0/12}
    volumes:
      - relay-data:/data
    # Reachable only from this machine. Put an HTTPS reverse proxy in front to share it.
    ports:
      - 127.0.0.1:3090:3090
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    stop_grace_period: 2m

volumes:
  relay-data:
