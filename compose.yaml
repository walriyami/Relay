name: relay

services:
  relay:
    image: relay:1.0.0
    build: .
    init: true
    restart: unless-stopped
    # The host's own network, so browsers on it can transfer directly: Relay's helper checks and
    # answers them on UDP RELAY_DIRECT_PORT from here. Relay itself listens only on its socket,
    # which the gateway alone can reach; see docs/self-hosting.md.
    network_mode: host
    environment:
      # Required for a public hostname. Unset, only localhost and IP addresses work.
      RELAY_ORIGIN: ${RELAY_ORIGIN:-}
      # Optional. Derives link and request tokens; unset, Relay keeps a generated key in the volume.
      RELAY_SECRET: ${RELAY_SECRET:-}
      # Optional. true makes first setup ask for the one-time key in /data/setup.key.
      RELAY_SETUP_KEY: ${RELAY_SETUP_KEY:-}
      # Optional. false turns direct transfers on the local network off.
      RELAY_DIRECT: ${RELAY_DIRECT:-}
      RELAY_DIRECT_PORT: ${RELAY_DIRECT_PORT:-3090}
      RELAY_SOCKET: /run/relay/relay.sock
    volumes:
      - relay-data:/data
      - relay-socket:/run/relay
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 1g
    pids_limit: 128
    stop_grace_period: 2m

  # Stable loopback origin for an HTTPS proxy. Optional container-network
  # integration is configured separately; see compose.tunnel.yaml.
  relay-gateway:
    image: caddy@sha256:14a9c00d4e833ebc2b65d36515b37bde3b73f0b323a2663aaafc88953d8c4e3f
    restart: unless-stopped
    user: "65532:65532"
    read_only: true
    tmpfs:
      - /config:rw,noexec,nosuid,size=8m,uid=65532,gid=65532
      - /data:rw,noexec,nosuid,size=8m,uid=65532,gid=65532
    cap_drop: [ALL]
    # The upstream Caddy binary has this file capability; removing it from the
    # bounding set prevents that binary from executing, even on port 3090.
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    mem_limit: 128m
    pids_limit: 64
    depends_on:
      relay:
        condition: service_healthy
    environment:
      # Trust only proxies whose addresses are explicitly supplied here.
      RELAY_CADDY_TRUSTED_PROXIES: ${RELAY_CADDY_TRUSTED_PROXIES:-127.0.0.1 ::1}
    command: ["caddy", "run", "--config", "/etc/caddy/Caddyfile", "--adapter", "caddyfile"]
    volumes:
      - ./proxy/Caddyfile:/etc/caddy/Caddyfile:ro
      - relay-socket:/run/relay:ro
    # Relay's group, which its socket belongs to.
    group_add: ["1000"]
    ports:
      - 127.0.0.1:3090:3090

volumes:
  relay-data:
  relay-socket:
