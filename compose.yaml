name: relay

services:
  relay:
    image: relay:1.0.0
    build: .
    init: true
    restart: unless-stopped
    environment:
      # Required for a public hostname. Unset, only localhost and IP addresses work.
      RELAY_ORIGIN: ${RELAY_ORIGIN:-}
      # Optional. Derives link and request tokens; unset, Relay keeps a generated key in the volume.
      RELAY_SECRET: ${RELAY_SECRET:-}
      # Optional. true makes first setup ask for the one-time key in /data/setup.key.
      RELAY_SETUP_KEY: ${RELAY_SETUP_KEY:-}
      # Optional. The proxies that report visitors' addresses, by address, range or container name.
      RELAY_TRUST_PROXY: ${RELAY_TRUST_PROXY:-}
      # Optional. false turns direct transfers on the local network off.
      RELAY_DIRECT: ${RELAY_DIRECT:-}
      RELAY_DIRECT_PORT: ${RELAY_DIRECT_PORT:-3090}
    # Only this machine can reach Relay here; put an HTTPS proxy or tunnel in front of it to share it.
    ports:
      - 127.0.0.1:3090:3090
    volumes:
      - relay-data:/data
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 1g
    pids_limit: 128
    stop_grace_period: 2m

volumes:
  relay-data:
