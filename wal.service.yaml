version: 1
id: relay
name: Relay
source:
  path: /Users/riyami/Desktop/Projects/Transfer Projects/Relay
  deviceId: ef5fb737-492c-48ea-bbdf-85f0d8dce674
  inputs:
    - Dockerfile
    - package.json
    - package-lock.json
    - vendor
    - client
    - server
    - shared
    - local
    - public
    - index.html
    - tsconfig.json
    - vite.config.ts
  exclude: []
runtime:
  port: 3090
  healthPath: /api/health
  memoryMB: 768
  # Direct transfers: the helper's UDP port, on the Pi's home address only (never on the internet).
  # The port must match inside and out, since the helper announces it (RELAY_DIRECT_ADDRESSES).
  lanServices:
    - { bind: 192.168.1.23, port: 3090, containerPort: 3090, protocol: udp }
storage:
  - name: data
    mount: /data
    kind: data
    resettable: false
auth:
  mode: oidc
  gatewayProtection: false
  publicPaths:
    - /*
  standalone: true
adapter: relay
