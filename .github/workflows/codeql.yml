name: CodeQL

on:
  push:
    branches: [main]
  pull_request:

jobs:
  analyze:
    name: Analyze
    # Code scanning is free for public repositories. Private ones need GitHub Code Security.
    if: github.event.repository.visibility == 'public'
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4
        with:
          languages: javascript-typescript
          queries: security-extended
      - uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4
